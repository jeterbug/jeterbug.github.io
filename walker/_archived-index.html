<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walker "Potty Mouth" Carson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ink: #141517;
    --cream: #f4f2ee;
    --sand: #d6d1c1;
    --sand2: #d9d3c9;
    --white: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Manrope", Arial, Helvetica, sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
  }
  /* subtle sand corner wash, keeps it restrained */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 120%, var(--sand) 0%, rgba(214,209,193,0) 55%);
    pointer-events: none;
    z-index: 0;
  }
  .wordmark {
    position: fixed;
    top: 26px;
    left: 0; right: 0;
    text-align: center;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--ink);
    z-index: 3;
  }
  .stage { position: relative; z-index: 2; }
  h1 {
    font-weight: 800;
    font-size: clamp(30px, 6vw, 68px);
    margin: 0 20px 10px;
    letter-spacing: -1px;
    line-height: 1.02;
  }
  .sub {
    font-weight: 500;
    font-size: clamp(13px, 2.4vw, 19px);
    color: #55564f;
    margin: 0 24px 42px;
  }
  .btn {
    border: none;
    cursor: pointer;
    width: min(58vw, 240px);
    height: min(58vw, 240px);
    border-radius: 50%;
    background: var(--ink);
    color: var(--cream);
    font-family: "Manrope", Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(18px, 4.5vw, 30px);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    box-shadow: 0 12px 0 #000, 0 22px 32px rgba(20,21,23,0.28);
    transition: transform 0.05s ease, box-shadow 0.05s ease;
    padding: 12px;
  }
  .btn:hover { background: #000; }
  .btn:active {
    transform: translateY(11px);
    box-shadow: 0 1px 0 #000, 0 6px 14px rgba(20,21,23,0.3);
  }
  .btn small {
    display: block;
    font-weight: 500;
    text-transform: none;
    font-size: 0.42em;
    letter-spacing: 0;
    color: var(--sand);
    margin-top: 4px;
  }
  .hint {
    margin-top: 34px;
    font-weight: 500;
    font-size: 13px;
    color: #7a7b73;
  }
  /* the flying face */
  #face {
    position: fixed;
    top: 50%;
    left: -50vw;
    width: min(72vw, 420px);
    /* transparent PNG: no border, use drop-shadow so it hugs the cutout */
    filter: drop-shadow(0 16px 30px rgba(20,21,23,0.35));
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    transform: translateY(-50%);
  }
  @keyframes flyAcross {
    0%   { left: -50vw; transform: translateY(-50%) rotate(-22deg) scale(0.7); opacity: 1; }
    50%  { transform: translateY(-50%) rotate(14deg) scale(1.12); }
    100% { left: 120vw; transform: translateY(-50%) rotate(32deg) scale(0.7); opacity: 1; }
  }
  .fly { animation: flyAcross 2.6s ease-in-out forwards; }
  @keyframes popShake {
    0%   { opacity: 0; left: 50%; transform: translate(-50%, -50%) scale(0); }
    18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.22); }
    30%  { transform: translate(-50%, -50%) scale(1) rotate(-7deg); }
    40%  { transform: translate(-52%, -50%) rotate(7deg); }
    50%  { transform: translate(-48%, -50%) rotate(-7deg); }
    60%  { transform: translate(-52%, -50%) rotate(7deg); }
    70%  { transform: translate(-48%, -50%) rotate(-5deg); }
    80%  { transform: translate(-51%, -50%) rotate(3deg); }
    90%  { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
  }
  .popshake { left: 50% !important; animation: popShake 1.6s ease-in-out forwards; }
  .spark {
    position: fixed;
    font-size: 30px;
    z-index: 60;
    pointer-events: none;
    will-change: transform, opacity;
  }
</style>
</head>

    <div class="hint">Tap again for more chaos.</div>

<script>
  const btn = document.getElementById('hornBtn');
  const clip = document.getElementById('clip');
  const face = document.getElementById('face');
  let toggle = false;

  function burst() {
    const marks = ['🗯️','💥','⚡','🚨','🔊','😤'];
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.textContent = marks[Math.floor(Math.random() * marks.length)];
      s.style.left = (50 + (Math.random() * 20 - 10)) + 'vw';
      s.style.top = '50vh';
      document.body.appendChild(s);
      const dx = (Math.random() * 200 - 100);
      const dy = (Math.random() * -260 - 60);
      const rot = (Math.random() * 720 - 360);
      s.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + dx + 'px, ' + dy + 'px) rotate(' + rot + 'deg)', opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.2,.8,.3,1)' });
      setTimeout(function(){ s.remove(); }, 1700);
    }
  }

  function go() {
    clip.currentTime = 0;
    clip.play().catch(function(){});

    face.classList.remove('fly', 'popshake');
    void face.offsetWidth; // reflow to restart animation
    face.style.opacity = 1;
    face.classList.add(toggle ? 'popshake' : 'fly');
    toggle = !toggle;

    burst();
  }

  btn.addEventListener('click', go);
</script>
